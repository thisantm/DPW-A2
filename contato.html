<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Empresa Exemplo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="produtos.php">Produtos</a></li>
                <li><a href="novidades.html">Novidades</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contato</h1>
        <form id="form-contato">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" required></textarea>
            <button type="submit">Enviar</button>
            <script>
                document.getElementById('form-contato').addEventListener('submit', function (e) {
                    e.preventDefault();
                    const nome = document.getElementById('nome').value;
                    const email = document.getElementById('email').value;
                    const mensagem = document.getElementById('mensagem').value;
                    const destinatario = 'esseemailnaoexiste@mercadobomviver.com.br';
                    const assunto = encodeURIComponent('Contato pelo site - Mercado Bom Viver - ' + nome);
                    const corpo = encodeURIComponent(`Nome: ${nome}\nEmail: ${email}\nMensagem: ${mensagem}`);
                    window.location.href = `mailto:${destinatario}?subject=${assunto}&body=${corpo}`;
                });
            </script>
        </form>
        <div class="redes-sociais">
            <h2>Redes Sociais</h2>
            <a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a> |
            <a href="https://www.facebook.com/" target="_blank" rel="noopener">Facebook</a> |
            <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Mercado Bom Viver</p>
    </footer>
</body>

</html>
